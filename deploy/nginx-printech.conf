# Production reverse proxy hardening for PrINTech.
# Replace server_name, upstreams, TLS certificate paths, and admin allowlist before use.

limit_req_zone $binary_remote_addr zone=printech_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=printech_auth:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name printech.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name printech.example.org;

    ssl_certificate /etc/letsencrypt/live/printech.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printech.example.org/privkey.pem;

    client_max_body_size 105m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'" always;

    location /api/v1/token/ {
        limit_req zone=printech_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=printech_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        auth_basic "PrINTech admin";
        auth_basic_user_file /etc/nginx/printech-admin.htpasswd;
        allow 127.0.0.1;
        # allow 203.0.113.10;  # Add trusted admin IPs here.
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /var/www/printech/frontend;
        try_files $uri $uri/ /index.html;
    }
}
