services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: printech_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-back}
      POSTGRES_DB: ${POSTGRES_DB:-back}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-back} -d ${POSTGRES_DB:-back}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Backend Django 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printech_back
    restart: unless-stopped
    # Exécute automatiquement les migrations avant de lancer le serveur
    command: >
      sh -c "uv run ./manage.py migrate &&
             uv run ./manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-back}
      - POSTGRES_USER=${POSTGRES_USER:-back}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # 3. Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printech_front
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge