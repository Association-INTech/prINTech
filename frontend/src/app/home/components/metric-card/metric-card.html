<div class="cards-grid">
    <div class="metric-card">
      <div class="label">Crédit restant</div>
      <div class="value">{{UserCredit()}}€</div>
      <div class="sub">Adhérent {{ is_active() ? 'actif' : 'inactif' }}</div>
      <button class="reload-btn" type="button" routerLink="./profile">
        + Recharger
      </button>
    </div>
    <div class="metric-card">
      <div class="label">Imprimantes actives</div>
      <div class="value"> {{Active_printers()}} / {{Total_printers()}} </div>
      <div class="sub">
        <span class="badge" 
          [class.badge-success]="Printer_statuses() === 'Disponible'"
          [class.badge-danger]="Printer_statuses() === 'Complet'"
        >{{Printer_statuses()}}</span>
      </div>
    </div>
    <div class="metric-card">
      <div class="label">Travaux en file</div>
       <div class="value"> {{ Queue_size() }}</div>
      <div class="sub"></div> 
      <button class="reload-btn" type="button" routerLink="./history">
        + Consulter
      </button>
    </div>
  </div>
